# Publish a release's packages when a version tag (v0.1.0, v1.2.0-rc.1,
# ...) appears: run every CI job (ci.yml), then package what the Linux and
# Windows jobs built, attest where each package came from, and attach the
# packages and their SHA-256 sums to the tag's GitHub release.
#
# Either way of releasing works:
#   - Publish a release in GitHub's interface (that creates the tag): the
#     packages are attached to it a few minutes later.
#   - Push a tag with git: the release is created, with generated notes;
#     a hyphen in the tag (v1.0.0-rc.1) makes it a pre-release.
# macOS comes later, with signing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # Create the release
      id-token: write     # Sign the provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch the packages CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mudclarity-*
          path: staged

      - name: Package
        run: |
          mkdir -p dist
          # Artifacts don't keep the executable bit.
          chmod +x staged/mudclarity-linux-amd64/mudclarity
          for os in linux windows; do
            mv "staged/mudclarity-$os-amd64" "staged/mudclarity-$TAG-$os-amd64"
          done
          tar -czf "dist/mudclarity-$TAG-linux-amd64.tar.gz" -C staged "mudclarity-$TAG-linux-amd64"
          (cd staged && zip -qr "../dist/mudclarity-$TAG-windows-amd64.zip" "mudclarity-$TAG-windows-amd64")
          (cd dist && sha256sum mudclarity-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest where the packages came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # A release made in GitHub's interface creates the tag when it is
      # published, which starts this workflow: the release is already
      # there, so attach the packages to it and leave its title, notes and
      # pre-release setting as written. A tag pushed with git has no
      # release yet: create one. Re-running either way replaces the files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "Attached the packages to the existing release $TAG."
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Mud Clarity $TAG" \
              --generate-notes \
              $prerelease \
              --notes "**Downloads:** Windows (\`.zip\`, SDL3 included) and Linux (\`.tar.gz\`). On Linux, install **SDL3 3.2 or newer** and a Vulkan driver from your distribution and keep them up to date; they aren't included (see README.txt in the package). Check a download with \`sha256sum -c SHA256SUMS\` or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo "Created the release $TAG."
          fi
