# Publish a release when a version tag (v0.1.0, v1.2.0-rc.1, ...) is
# pushed: run every CI job (ci.yml), then package what the Linux and
# Windows jobs built, attest where each package came from, and attach the
# packages and their SHA-256 sums to a GitHub release for the tag. A tag
# with a hyphen (v1.0.0-rc.1) makes a pre-release. macOS comes later, with
# signing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # Create the release
      id-token: write     # Sign the provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch the packages CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mudclarity-*
          path: staged

      - name: Package
        run: |
          mkdir -p dist
          # Artifacts don't keep the executable bit.
          chmod +x staged/mudclarity-linux-amd64/mudclarity
          for os in linux windows; do
            mv "staged/mudclarity-$os-amd64" "staged/mudclarity-$TAG-$os-amd64"
          done
          tar -czf "dist/mudclarity-$TAG-linux-amd64.tar.gz" -C staged "mudclarity-$TAG-linux-amd64"
          (cd staged && zip -qr "../dist/mudclarity-$TAG-windows-amd64.zip" "mudclarity-$TAG-windows-amd64")
          (cd dist && sha256sum mudclarity-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest where the packages came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Mud Clarity $TAG" \
            --generate-notes \
            $prerelease \
            --notes "**Downloads:** Windows (\`.zip\`, SDL3 included) and Linux (\`.tar.gz\`). On Linux, install **SDL3 3.2 or newer** and a Vulkan driver from your distribution and keep them up to date; they aren't included (see README.txt in the package). Check a download with \`sha256sum -c SHA256SUMS\` or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
